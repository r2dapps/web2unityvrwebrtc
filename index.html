<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doctor VR WebRTC Consultation Portal | Web2RVR</title>
  
  <!-- SEO & Social Meta Tags -->
  <meta name="description" content="Real-time WebRTC live HD video & audio streaming gateway for Doctor Telemedicine, Meta Quest 3 VR, and Web Devices.">
  <meta name="keywords" content="WebRTC, Telemedicine, VR, Meta Quest 3, Unity, Firebase, P2P Video Call">
  <meta name="theme-color" content="#0b0f19">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- Screen 1: Role Selection & Room Setup -->
  <div id="startScreen" class="screen-container">
    <div class="card start-card">
      <div class="brand-logo">
        <i class="fa-solid fa-vr-cardboard"></i>
      </div>
      <h2>AetherCare Web2RVR</h2>
      <p class="subtitle">Real-Time WebRTC P2P Telemedicine Gateway</p>

      <!-- Role Tabs: Doctor (Host) vs Patient / VR (Joiner) -->
      <div class="role-tabs">
        <button class="role-tab active" id="tabDoctor"><i class="fa-solid fa-user-doctor"></i> Doctor (Host)</button>
        <button class="role-tab" id="tabPatient"><i class="fa-solid fa-hospital-user"></i> Patient / VR (Joiner)</button>
      </div>

      <!-- Doctor View Panel -->
      <div id="panelDoctor" class="role-panel">
        <div class="form-group">
          <label for="doctorRoomInput"><i class="fa-solid fa-key"></i> Room Key</label>
          <div class="input-with-btn">
            <input type="text" id="doctorRoomInput" value="DOC-8921" readonly>
            <button id="btnNewKey" class="btn-icon" title="New Key"><i class="fa-solid fa-rotate"></i></button>
          </div>
          <div class="expiry-info">
            <i class="fa-solid fa-clock"></i> Expires: <span id="expiryTimeText">12:00 AM IST</span>
          </div>
        </div>
        <p class="help-text">Share Room Key <strong><span id="shareRoomKeyTag">DOC-8921</span></strong> with Patient or Unity VR.</p>
        <button id="btnCreateRoom" class="btn btn-primary btn-block">
          <i class="fa-solid fa-video"></i> Create Room & Start Camera
        </button>
      </div>

      <!-- Patient / VR View Panel -->
      <div id="panelPatient" class="role-panel" style="display: none;">
        <div class="form-group">
          <label for="patientRoomInput"><i class="fa-solid fa-key"></i> Enter Doctor's Room Key</label>
          <input type="text" id="patientRoomInput" placeholder="e.g. DOC-8921">
        </div>
        <p class="help-text">Enter the Room Key provided by the Doctor to connect instantly.</p>
        <button id="btnJoinAsPatient" class="btn btn-success btn-block">
          <i class="fa-solid fa-plug"></i> Join Consultation Room
        </button>
      </div>

    </div>
  </div>

  <!-- Screen 2: Active Full-Screen Video Call View -->
  <div id="callScreen" class="screen-container" style="display: none;">
    <div class="vr-stream-container">
      
      <!-- Full Screen Background: Remote Video Stream (Patient VR or Doctor) -->
      <video id="remoteVideo" autoplay playsinline class="vr-video-full"></video>
      
      <!-- Connecting Overlay -->
      <div id="connectingOverlay" class="vr-overlay">
        <div class="spinner"></div>
        <h3 id="connectingTitle">Connecting to Peer...</h3>
        <p>Room Key: <strong id="displayRoomKey">DOC-8921</strong></p>
      </div>

      <!-- Top Bar Overlay -->
      <div class="top-overlay">
        <div class="room-pill">
          <span class="pulse-dot"></span>
          <span id="activeRoomTag">DOC-8921</span>
        </div>
        <button id="btnCopyKey" class="pill-btn"><i class="fa-solid fa-copy"></i> Copy Key</button>
      </div>

      <!-- Floating Picture-in-Picture: Local Webcam Stream -->
      <div class="floating-pip">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="pip-label" id="localPipLabel">You</div>
      </div>

      <!-- Bottom Floating Control Bar -->
      <div class="bottom-controls">
        <button id="btnToggleMic" class="control-btn"><i class="fa-solid fa-microphone"></i></button>
        <button id="btnToggleCam" class="control-btn"><i class="fa-solid fa-video"></i></button>
        <button id="btnFlipCam" class="control-btn"><i class="fa-solid fa-camera-rotate"></i></button>
        <button id="btnEndSession" class="control-btn btn-end"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
